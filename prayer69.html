<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบสแกนละหมาด</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Prompt', sans-serif; background: linear-gradient(135deg, #10b981, #047857); min-height: 100vh; color: #1f2937; }
    .card { background: rgba(255, 255, 255, 0.95); border-radius: 1rem; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1); transition: transform 0.3s ease; }
    .btn { transition: all 0.2s ease; border-radius: 0.75rem; font-weight: 500; }
    .btn:hover { transform: scale(1.02); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none !important; }
    .modal { background: rgba(0, 0, 0, 0.6); animation: fadeIn 0.3s ease; z-index: 1000; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal-content { animation: slideIn 0.3s ease; }
    @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .badge { background: linear-gradient(90deg, #10b981, #047857); border-radius: 0.5rem; padding: 0.4rem 0.8rem; color: white; display: inline-block; margin: 0.2rem; font-weight: 500; animation: popIn 0.2s ease; }
    .badge.offline { background: linear-gradient(90deg, #f59e0b, #d97706); }
    @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    input, select { width: 100%; padding: 0.6rem; border: 1px solid #d1d5db; border-radius: 0.5rem; }
    .toggle-btn { background: #6b7280; color: white; width: 2.5rem; height: 2.5rem; display: flex; align-items: center; justify-content: center; border-radius: 0.5rem; cursor: pointer; transition: 0.3s; }
    .toggle-btn:hover { background: #4b5563; transform: scale(1.1); }
    .input-section { transition: max-height 0.3s ease, opacity 0.3s ease; overflow: hidden; max-height: 0; opacity: 0; }
    .input-section.visible { max-height: 500px; opacity: 1; }
    .spinner { display: inline-block; width: 1rem; height: 1rem; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: white; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="flex items-center justify-center p-4">
  <div class="card w-full max-w-md p-6">
    <h2 class="text-2xl font-bold text-center text-green-700 mb-4">
      <i class="fas fa-mosque mr-2"></i> สแกนละหมาด
    </h2>

    <!-- Connection & Stats Status -->
    <div class="bg-gray-50 rounded-lg p-3 mb-4 flex justify-between items-center text-sm">
      <div id="connectionStatus"><i class="fas fa-circle text-yellow-500"></i> กำลังเชื่อมต่อ...</div>
      <div id="dailyStats" class="text-gray-600 font-medium">วันนี้: <span class="text-green-600 font-bold">-</span> | รวม: <span class="text-green-600 font-bold">-</span></div>
    </div>
    
    <div class="flex justify-end mb-2">
      <button class="toggle-btn" onclick="toggleInputFields()" title="แสดงตัวเลือก">
        <i id="toggleInputIcon" class="fas fa-plus"></i>
      </button>
    </div>

    <div id="inputFields" class="input-section mb-4">
      <div class="mb-3">
        <label class="block text-sm font-medium text-gray-700 mb-1"><i class="fas fa-pray mr-1"></i> เลือกกะ</label>
        <select id="prayerSelect">
          <option value="auto">อัตโนมัติ</option>
          <option value="Subhi">Subhi</option>
          <option value="Dhur">Dhur</option>
          <option value="Asri">Asri</option>
          <option value="Maqrhib">Maqrhib</option>
          <option value="Isha">Isha</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="block text-sm font-medium text-gray-700 mb-1"><i class="fas fa-cogs mr-1"></i> โหมดบันทึก</label>
        <select id="modeSelect">
          <option value="realtime">บันทึกทันที</option>
          <option value="batch">บันทึกแบบเป็นชุด</option>
        </select>
      </div>
      <button id="btnProcessBatch" onclick="processBatch()" class="btn bg-blue-600 text-white w-full py-3 mb-2">
        <i class="fas fa-sync mr-1"></i> ประมวลผลชุดข้อมูล
      </button>
    </div>

    <div id="reader" class="w-full mb-4 border-2 border-green-300 rounded-lg overflow-hidden bg-gray-100" style="min-height: 250px;"></div>

    <div class="mb-4">
      <div class="flex items-center gap-2">
        <input type="text" id="manualCode" placeholder="กรอกรหัส QR หรือรหัสนิ้วมือ..." class="flex-1">
        <button id="btnManualSubmit" onclick="submitManualCode()" class="btn bg-green-600 text-white px-4 py-3">
          <i class="fas fa-check"></i>
        </button>
      </div>
    </div>

    <div id="scanned" class="text-center mb-4 flex flex-wrap justify-center max-h-32 overflow-y-auto"></div>

    <div class="flex justify-end mb-2">
      <button class="toggle-btn" onclick="toggleActionButtons()" title="จัดการระบบ">
        <i id="toggleActionIcon" class="fas fa-cog"></i>
      </button>
    </div>

    <div id="actionButtons" class="flex flex-wrap justify-center gap-3 hidden mb-4">
      <button onclick="promptAuth('export')" class="btn bg-green-600 text-white px-4 py-2 text-sm"><i class="fas fa-file-export mr-1"></i> ส่งออก CSV</button>
      <button onclick="promptAuth('settings')" class="btn bg-gray-600 text-white px-4 py-2 text-sm"><i class="fas fa-sliders-h mr-1"></i> ตั้งค่า</button>
    </div>

    <!-- Modals (Prayer, Export, Auth) -->
    <div id="prayerModal" class="modal fixed inset-0 flex items-center justify-center hidden">
      <div class="modal-content card w-full max-w-sm p-6">
        <span class="text-gray-500 text-2xl font-bold float-right cursor-pointer" onclick="closeModal('prayerModal')">×</span>
        <h3 class="text-xl font-bold text-green-700 mb-4"><i class="fas fa-clock mr-1"></i> ตั้งค่าวักตู</h3>
        <div id="prayerForm" class="space-y-3"></div>
        <button onclick="savePrayerTimes()" class="btn bg-green-600 text-white w-full py-3 mt-4">บันทึก</button>
      </div>
    </div>

    <div id="exportModal" class="modal fixed inset-0 flex items-center justify-center hidden">
      <div class="modal-content card w-full max-w-sm p-6">
        <span class="text-gray-500 text-2xl font-bold float-right cursor-pointer" onclick="closeModal('exportModal')">×</span>
        <h3 class="text-xl font-bold text-green-700 mb-4"><i class="fas fa-file-export mr-1"></i> ส่งออก CSV</h3>
        <div class="space-y-3">
          <input type="date" id="startDate" placeholder="วันที่เริ่ม">
          <input type="date" id="endDate" placeholder="วันที่สิ้นสุด">
          <select id="exportPrayerSelect" multiple size="5">
            <option value="Subhi">Subhi</option><option value="Dhur">Dhur</option><option value="Asri">Asri</option><option value="Maqrhib">Maqrhib</option><option value="Isha">Isha</option>
          </select>
        </div>
        <button id="btnExport" onclick="exportCSVWithFilters()" class="btn bg-green-600 text-white w-full py-3 mt-4">ดาวน์โหลด CSV</button>
      </div>
    </div>

    <div id="authModal" class="modal fixed inset-0 flex items-center justify-center hidden">
      <div class="modal-content card w-full max-w-sm p-6">
        <span class="text-gray-500 text-2xl font-bold float-right cursor-pointer" onclick="closeModal('authModal')">×</span>
        <h3 class="text-xl font-bold text-green-700 mb-4"><i class="fas fa-lock mr-1"></i> ยืนยันตัวตน</h3>
        <div class="space-y-3">
          <input type="text" id="authUsername" placeholder="ชื่อผู้ใช้">
          <input type="password" id="authPassword" placeholder="รหัสผ่าน" onkeydown="if(event.key==='Enter')submitAuth()">
        </div>
        <button id="btnAuth" onclick="submitAuth()" class="btn bg-green-600 text-white w-full py-3 mt-4">เข้าสู่ระบบ</button>
      </div>
    </div>

    <footer class="text-center text-sm text-gray-600 mt-4 pt-4 border-t border-gray-200">
      © 2025 <strong>ระบบสแกนละหมาด</strong> | <span class="text-green-600 font-bold">FANTECH</span>
    </footer>
  </div>

  <!-- เสียงตอบรับ -->
  <audio id="successSound" src="https://actions.google.com/sounds/v1/cartoon/pop.ogg" preload="auto"></audio>
  <audio id="errorSound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>

  <script>
    // ⚠️ เปลี่ยน URL นี้เป็น Web App URL ของคุณ
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycby1OgZSVWNDWO1r1_Jc9rQGSN7yCV4JPVdwPhy1WtcIqUDvLLgMigTtyCkKcSvUDzQ/exec";

    let prayerTimes = [{ name: "Subhi", end: 630 }, { name: "Dhur", end: 1430 }, { name: "Asri", end: 1730 }, { name: "Maqrhib", end: 1900 }, { name: "Isha", end: 2359 }];
    const scannedMap = new Set();
    let lastAlertTime = 0;
    let lastDate = null;
    let authAction = null;
    let isProcessing = false;

    // --- Central API Call ---
    async function callGAS(action, payload = {}) {
      const dataToSend = { action, ...payload };
      try {
        const response = await fetch(GAS_API_URL, { method: "POST", body: JSON.stringify(dataToSend), redirect: "follow" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return await response.json();
      } catch (error) {
        console.error("API Error:", error);
        return { success: false, message: "การเชื่อมต่อล้มเหลว: " + error.message, isOffline: true };
      }
    }

    // --- Offline Queue Management ---
    function saveToOfflineQueue(data) {
      let queue = JSON.parse(localStorage.getItem('scanQueue') || '[]');
      queue.push({ ...data, timestamp: Date.now() });
      localStorage.setItem('scanQueue', JSON.stringify(queue));
      updateConnectionStatus(false, " (บันทึกในเครื่อง รอส่งข้อมูล)");
    }

    async function processOfflineQueue() {
      let queue = JSON.parse(localStorage.getItem('scanQueue') || '[]');
      if (queue.length === 0) return;
      
      updateConnectionStatus(true, " (กำลังส่งข้อมูลที่ค้างอยู่...)");
      let processed = 0;
      
      for (let i = 0; i < queue.length; i++) {
        const item = queue[i];
        const res = await callGAS(item.action, item.payload);
        if (res.success) processed++;
      }
      
      if (processed > 0) {
        queue = queue.slice(processed);
        localStorage.setItem('scanQueue', JSON.stringify(queue));
        Swal.fire({ icon: 'success', title: 'ซิงค์ข้อมูลสำเร็จ', text: `ส่งข้อมูลที่ค้างอยู่ ${processed} รายการ`, timer: 2000, showConfirmButton: false, toast: true, position: 'top' });
      }
      updateConnectionStatus(true);
      loadDailyStats();
    }

    window.addEventListener('online', () => {
      processOfflineQueue();
      updateConnectionStatus(true);
    });

    // --- Core Logic ---
    function updateConnectionStatus(connected, extra = "") {
      const el = document.getElementById("connectionStatus");
      if (connected) el.innerHTML = `<i class="fas fa-circle text-green-500"></i> ออนไลน์${extra}`;
      else el.innerHTML = `<i class="fas fa-circle text-yellow-500"></i> ออฟไลน์${extra}`;
    }

    function detectPrayer() {
      const now = new Date();
      const hhmm = parseInt(`${now.getHours()}${now.getMinutes().toString().padStart(2, '0')}`);
      return prayerTimes.find(p => hhmm <= p.end)?.name || "Isha";
    }

    function checkDateAndReset() {
      const currentDate = new Date().toLocaleDateString('th-TH');
      if (lastDate && lastDate !== currentDate) {
        scannedMap.clear();
        document.getElementById("scanned").innerHTML = "";
      }
      lastDate = currentDate;
    }

    async function handleScan(decodedText) {
      if (isProcessing) return;
      checkDateAndReset();
      
      const currentPrayer = document.getElementById("prayerSelect").value === "auto" ? detectPrayer() : document.getElementById("prayerSelect").value;
      const mode = document.getElementById("modeSelect").value;
      const key = `${decodedText}|${currentPrayer}|${lastDate}`;

      if (scannedMap.has(key)) {
        if (Date.now() - lastAlertTime >= 2000) {
          Swal.fire({ icon: 'info', title: 'ซ้ำ', text: `บันทึกแล้ว: ${decodedText}`, timer: 1000, showConfirmButton: false, toast: true, position: 'top-end' });
          lastAlertTime = Date.now();
        }
        return;
      }

      scannedMap.add(key);
      const badge = document.createElement("span");
      badge.className = "badge offline"; // สมมติว่าออฟไลน์ก่อน
      badge.textContent = decodedText + " ⏳";
      document.getElementById("scanned").prepend(badge);

      const action = mode === "batch" ? "stageScan" : "logScan";
      const payload = { studentId: decodedText, prayer: currentPrayer };
      
      isProcessing = true;
      const res = await callGAS(action, payload);
      isProcessing = false;

      if (res.isOffline) {
        saveToOfflineQueue({ action, payload });
        badge.textContent = decodedText + " (รอส่ง)";
        document.getElementById("errorSound").play();
      } else if (res.success) {
        badge.className = "badge";
        badge.textContent = decodedText;
        document.getElementById("successSound").play();
        Swal.fire({ icon: 'success', title: 'สำเร็จ', html: `${res.name}<br>${res.class}`, timer: 1500, showConfirmButton: false, toast: true, position: 'top' });
        loadDailyStats();
      } else if (res.status === "not_found") {
        badge.style.background = "#ef4444";
        badge.textContent = decodedText + " (ไม่พบ)";
        document.getElementById("errorSound").play();
        Swal.fire({ icon: 'warning', title: 'ไม่พบข้อมูล', text: decodedText, timer: 1500, showConfirmButton: false });
      } else {
        badge.style.background = "#f59e0b";
        badge.textContent = decodedText + " (ซ้ำ)";
        Swal.fire({ icon: 'info', title: 'บันทึกซ้ำ', timer: 1000, showConfirmButton: false, toast: true, position: 'top-end' });
      }
      lastAlertTime = Date.now();
    }

    function submitManualCode() {
      const code = document.getElementById("manualCode").value.trim();
      if (code) { handleScan(code); document.getElementById("manualCode").value = ""; }
    }

    async function loadDailyStats() {
      const res = await callGAS("getDailyStats");
      if (res.success) {
        document.querySelector("#dailyStats span:first-child").textContent = res.today;
        document.querySelector("#dailyStats span:last-child").textContent = res.total;
      }
    }

    async function initSystem() {
      const status = await callGAS("checkStatus");
      if (status.success) {
        updateConnectionStatus(true);
        loadDailyStats();
        processOfflineQueue(); // ตรวจสอบคิวค้างทันทีที่โหลด
      } else {
        updateConnectionStatus(false, " - " + status.message);
      }
    }

    function initScanner() {
      const html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start({ facingMode: "environment" }, { fps: 15, qrbox: { width: 250, height: 250 } }, handleScan, () => {}).catch(err => {
        console.error("Scanner error:", err);
      });
    }

    // --- Auth & Modals ---
    function promptAuth(action) {
      authAction = action;
      document.getElementById("authModal").classList.remove("hidden");
      document.getElementById("authModal").style.display = "flex";
      document.getElementById("authUsername").value = "";
      document.getElementById("authPassword").value = "";
      setTimeout(() => document.getElementById("authUsername").focus(), 100);
    }

    function closeModal(id) { document.getElementById(id).style.display = "none"; }

    async function submitAuth() {
      const username = document.getElementById("authUsername").value.trim();
      const password = document.getElementById("authPassword").value.trim();
      if (!username || !password) return Swal.fire('❌ ผิดพลาด', 'กรุณากรอกข้อมูลให้ครบ', 'error');

      const btn = document.getElementById("btnAuth");
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> กำลังตรวจสอบ...';

      const res = await callGAS("login", { credentials: { username, password } });
      btn.disabled = false; btn.innerHTML = 'เข้าสู่ระบบ';

      if (res.success) {
        closeModal("authModal");
        if (authAction === 'export') document.getElementById("exportModal").style.display = "flex";
        else if (authAction === 'settings') openPrayerModal();
      } else {
        Swal.fire('❌ ผิดพลาด', res.message, 'error');
      }
    }

    async function processBatch() {
      const btn = document.getElementById("btnProcessBatch");
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> กำลังประมวลผล...';
      const res = await callGAS("processBatch");
      btn.disabled = false; btn.innerHTML = '<i class="fas fa-sync mr-1"></i> ประมวลผลชุดข้อมูล';
      if (res.success) Swal.fire('✅ สำเร็จ', res.message, 'success');
      else Swal.fire('❌ ผิดพลาด', res.message, 'error');
      loadDailyStats();
    }

    async function exportCSVWithFilters() {
      const startDate = document.getElementById("startDate").value;
      const endDate = document.getElementById("endDate").value;
      if (!startDate || !endDate) return Swal.fire('❌ ผิดพลาด', 'กรุณาเลือกวันที่', 'error');

      const selectedPrayers = Array.from(document.getElementById("exportPrayerSelect").selectedOptions).map(o => o.value);
      const filters = { startDate, endDate, prayers: selectedPrayers.length > 0 ? selectedPrayers : ["Subhi", "Dhur", "Asri", "Maqrhib", "Isha"] };

      const btn = document.getElementById("btnExport");
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> กำลังสร้างไฟล์...';

      const res = await callGAS("exportCSV", { filters });
      btn.disabled = false; btn.innerHTML = 'ดาวน์โหลด CSV';

      if (res.success && res.content) {
        const blob = new Blob([res.content], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = res.filename;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
        closeModal("exportModal");
        Swal.fire('✅ สำเร็จ', 'ดาวน์โหลดเรียบร้อย', 'success');
      } else {
        Swal.fire('❌ ผิดพลาด', res.message || 'ไม่ได้รับข้อมูล', 'error');
      }
    }

    function openPrayerModal() {
      const form = document.getElementById("prayerForm");
      form.innerHTML = prayerTimes.map((p, i) => `
        <div class="flex items-center gap-2">
          <label class="text-sm font-medium text-gray-700 w-20">${p.name}:</label>
          <input type="number" id="end-${i}" value="${p.end}" min="0" max="2359" class="flex-1 p-2 border rounded">
        </div>
      `).join("") + `<button onclick="clearCache()" class="btn bg-red-500 text-white w-full py-2 mt-4"><i class="fas fa-trash mr-1"></i> ล้างแคชฐานข้อมูลนักเรียน</button>`;
      document.getElementById("prayerModal").style.display = "flex";
    }

    async function clearCache() {
      if(!confirm("ต้องการล้างแคชฐานข้อมูลนักเรียนหรือไม่? (ระบบจะดึงข้อมูลใหม่ในการสแกนครั้งถัดไป)")) return;
      const res = await callGAS("clearCache");
      if(res.success) {
        Swal.fire('✅ สำเร็จ', res.message, 'success');
        closeModal("prayerModal");
      } else {
        Swal.fire('❌ ผิดพลาด', res.message, 'error');
      }
    }

    function savePrayerTimes() {
      prayerTimes = prayerTimes.map((p, i) => {
        const end = parseInt(document.getElementById(`end-${i}`).value);
        return { name: p.name, end: isNaN(end) ? p.end : end };
      });
      closeModal("prayerModal");
      Swal.fire('✅ อัปเดตเรียบร้อย', '', 'success');
    }

    function toggleActionButtons() {
      const el = document.getElementById("actionButtons");
      const icon = document.getElementById("toggleActionIcon");
      el.classList.toggle("hidden");
      icon.className = el.classList.contains("hidden") ? "fas fa-cog" : "fas fa-times";
    }

    function toggleInputFields() {
      const el = document.getElementById("inputFields");
      const icon = document.getElementById("toggleInputIcon");
      el.classList.toggle("visible");
      icon.className = el.classList.contains("visible") ? "fas fa-minus" : "fas fa-plus";
    }

    document.getElementById("manualCode").addEventListener("keydown", function(e) {
      if (e.key === "Enter") { e.preventDefault(); submitManualCode(); }
    });

    window.addEventListener("DOMContentLoaded", () => {
      initSystem();
      initScanner();
    });
  </script>
</body>
</html>
